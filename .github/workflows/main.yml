name: Build Windows Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pygame==2.6.1 "pyinstaller>=6,<7"

      - name: Set game folder at startup
        shell: python
        run: |
          from pathlib import Path
          Path("game_folder_hook.py").write_text(
              "import os, sys\n"
              "os.chdir(os.path.dirname(sys.executable))\n"
          )

      - name: Build game with images
        run: python -m PyInstaller --noconfirm --onedir --windowed --name Snek --contents-directory "." --add-data "imgs:imgs" --runtime-hook game_folder_hook.py main.py

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: Snek-Windows
          path: dist/Snek/
          if-no-files-found: error
